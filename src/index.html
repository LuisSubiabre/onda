<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onda</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6.5v11a1 1 0 0 1-1.55.83L9 13.2V17a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v3.8l7.45-5.13A1 1 0 0 1 18 6.5z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.5v11a1 1 0 0 0 1.55.83L15 13.2V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v3.8L7.55 5.67A1 1 0 0 0 6 6.5z" fill="currentColor"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-once" viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7M17 15v6l4.5-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stopafter" viewBox="0 0 24 24"><path d="M3 7h9M3 12h9M3 17h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="14.5" y="12.5" width="7" height="7" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-trim" viewBox="0 0 24 24"><path d="M6 3v13a2 2 0 0 0 2 2h13M18 21V8a2 2 0 0 0-2-2H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 20v-6M9.5 20V8M14 20v-9M18.5 20V4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12c2-6 4-6 5 0s3 6 5 0 3-6 5 0 3 5 5 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>Onda</span>
      </div>
      <div class="top-actions">
        <div class="menu-wrap">
          <button id="settings" class="ghost icon-only" title="Ajustes"><svg><use href="#i-settings"/></svg></button>
          <div id="settings-menu" class="popover" hidden>
            <div class="pop-label">Fundido al pausar y entre pistas</div>
            <div id="fade-opts" class="segmented">
              <button data-fade="0">No</button>
              <button data-fade="1">1 s</button>
              <button data-fade="2">2 s</button>
              <button data-fade="3">3 s</button>
              <button data-fade="5">5 s</button>
            </div>
            <div class="pop-hint">Las pistas en bucle se repiten sin fundido.</div>
          </div>
        </div>
        <button id="clear" class="ghost" title="Vaciar lista">Vaciar</button>
        <button id="add" class="primary"><svg><use href="#i-plus"/></svg>Agregar</button>
      </div>
    </header>

    <main class="list-wrap">
      <ol id="list" class="list"></ol>
      <div id="empty" class="empty">
        <div class="empty-ring"><svg><use href="#i-plus"/></svg></div>
        <p class="empty-title">Tu lista está vacía</p>
        <p class="empty-sub">Arrastra archivos MP3 aquí o usa <b>Agregar</b></p>
      </div>
    </main>

    <div class="viz">
      <canvas id="spectrum" title="Clic para cambiar la visualización (V)"></canvas>
      <div class="viz-switch" role="group" aria-label="Visualización">
        <button data-viz="bars" title="Espectro"><svg><use href="#i-bars"/></svg></button>
        <button data-viz="wave" title="Ondas"><svg><use href="#i-wave"/></svg></button>
      </div>
    </div>

    <footer class="player">
      <div class="now">
        <div id="now-cover" class="cover big"><svg><use href="#i-note"/></svg></div>
        <div class="now-text">
          <div id="now-title" class="now-title">Nada sonando</div>
          <div id="now-sub" class="now-sub">—</div>
          <div id="now-meta" class="now-meta"></div>
        </div>
      </div>

      <div class="center">
        <div class="controls">
          <button id="mode" class="icon small" title="Modo de la pista"><svg><use href="#i-once"/></svg></button>
          <button id="prev" class="icon" title="Anterior"><svg><use href="#i-prev"/></svg></button>
          <button id="play" class="icon play" title="Reproducir (Espacio)"><svg><use href="#i-play"/></svg></button>
          <button id="next" class="icon" title="Siguiente"><svg><use href="#i-next"/></svg></button>
          <button id="autoplay" class="icon small" title="Reproducción automática de la lista"><svg><use href="#i-auto"/></svg></button>
          <button id="stopafter" class="icon small" title="Detener después de esta pista (S)"><svg><use href="#i-stopafter"/></svg></button>
        </div>
        <div class="seek">
          <span id="t-cur" class="time">0:00</span>
          <div class="seek-bar">
            <div id="trim-l" class="trim-mask"></div>
            <div id="trim-r" class="trim-mask"></div>
            <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
          </div>
          <span id="t-dur" class="time">0:00</span>
        </div>
      </div>

      <div class="volume">
        <button id="mute" class="icon small" title="Silenciar"><svg><use href="#i-vol"/></svg></button>
        <input id="vol" type="range" min="0" max="100" value="80" />
      </div>
    </footer>

    <div id="trim-dialog" class="dialog-back" hidden>
      <div class="dialog" role="dialog" aria-labelledby="trim-title">
        <div class="dialog-head">
          <div id="trim-cover" class="cover"><svg><use href="#i-note"/></svg></div>
          <div class="dialog-titles">
            <div class="pop-label">Recortar pista</div>
            <div id="trim-title" class="dialog-title"></div>
          </div>
        </div>
        <div class="trim-row">
          <label for="trim-start">Inicio</label>
          <input id="trim-start" class="time-input" placeholder="0:00" autocomplete="off" />
          <button id="trim-start-now" class="ghost small">Usar posición actual</button>
        </div>
        <div class="trim-row">
          <label for="trim-end">Fin</label>
          <input id="trim-end" class="time-input" placeholder="final" autocomplete="off" />
          <button id="trim-end-now" class="ghost small">Usar posición actual</button>
        </div>
        <div id="trim-info" class="pop-hint"></div>
        <div class="dialog-actions">
          <button id="trim-reset" class="ghost">Quitar recorte</button>
          <span class="spacer"></span>
          <button id="trim-preview" class="ghost">Escuchar el final</button>
          <button id="trim-done" class="primary">Listo</button>
        </div>
      </div>
    </div>

    <div id="drop" class="drop"><div>Suelta para agregar</div></div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
