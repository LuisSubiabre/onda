[package]
name = "onda"
version = "0.2.0"
description = "Reproductor de MP3 minimalista"
edition = "2021"

[lib]
name = "onda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
